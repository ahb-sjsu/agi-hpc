   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(553.889766 108.666018)">constitution</text>
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(553.302422 120.822639)">signed rules</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(814.844297 108.707033)">DEME</text>
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(806.280234 120.863654)">can veto</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(1025.924648 108.625002)">signed manifest</text>
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(1038.910195 120.863654)">+ body lock</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="1300.32" y="114.785344" transform="rotate(-0 1300.32 114.785344)">act</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(1195.468477 256.638744)">Found by this test, then fixed.</text>
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(1197.827695 268.877396)">The lift she had not asked for</text>
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(1180.982578 281.034018)">passed DEME until 18 Oct. Now the</text>
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(1186.475391 293.190639)">scene's no-lift rule reaches DEME</text>
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(1207.777266 305.34726)">as a fact. Rerun: only that</text>
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(1235.420156 317.585912)">verdict changed.</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 15.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #6a4c93" x="756" y="25.445031" transform="rotate(-0 756 25.445031)">In the robot, DEME is a firewall: it vets each proposed act and never picks one</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #b3261e" transform="translate(1434.083125 103.43634)">any stop:</text>
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #b3261e" transform="translate(1434.013359 114.509406)">the robot</text>
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #b3261e" transform="translate(1444.579883 125.508254)">holds</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="45.36" y="187.592359" transform="rotate(-0 45.36 187.592359)">Change one input, nothing else. Does the verdict follow?</text>
   </g>
